<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskNest Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>TaskNest Login</h1>

<input id="email" type="email" placeholder="Email" style="padding:12px;width:250px;margin:10px;">
<br>

<input id="password" type="password" placeholder="Password" style="padding:12px;width:250px;margin:10px;">
<br>

<button id="loginBtn">Login</button>

</div>


<script type="module">

import { auth } from "./firebase.js";

import { 
signInWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


document.getElementById("loginBtn").onclick = function(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;


signInWithEmailAndPassword(auth, email, password)

.then(() => {

window.location.href = "dashboard.html";

})

.catch((error)=>{

alert(error.message);

});

};

</script>

</body>
</html>
